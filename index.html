<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="nim">
    <meta name="theme-color" content="#060610">
    <title>nim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060610;
        }

        #void {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #0a0e1a 0%, #060610 60%, #030306 100%);
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        #nim-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }

        #nim-logo {
            width: clamp(60px, 12vw, 160px);
            height: auto;
            filter: drop-shadow(0 0 8px rgba(108, 140, 255, 0.5))
                    drop-shadow(0 0 25px rgba(108, 140, 255, 0.2));
            animation: nim-breathe 7s ease-in-out infinite;
        }

        @keyframes nim-breathe {
            0%, 100% { opacity: 0.525; transform: scale(1); }
            50% { opacity: 0.6375; transform: scale(1.005); }
        }

        #vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(3, 3, 6, 0.9) 100%);
        }

        #scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 21;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.06) 0px,
                rgba(0, 0, 0, 0.06) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.25;
        }
    </style>
</head>
<body>
    <div id="void">
        <canvas id="wave-field"></canvas>
        <div id="nim-container">
            <svg id="nim-logo" xmlns="http://www.w3.org/2000/svg" viewBox="50 -496 1152 516"><path fill="#6C8CFF" d="M111 10h-11q-40 0-40-40v-353q0-29 20-49l33-33q20-20 49-20h124q29 0 49 21l32 32q20 20 20 49v353q0 40-40 40h-10q-40 0-40-40v-324q0-40-40-40h-66q-40 0-40 40v324q0 40-40 40m437-495h10q40 0 40 40v414q0 40-40 40h-10q-40 0-40-40v-414q0-40 40-40M769 8h-10q-40 0-40-40v-351q0-30 20-50l32-32q20-20 49-20h63q15 0 26.5 5t22.5 16q13 13 26 13 11 0 22-11l2-2q11-11 22.5-16t26.5-5h59q15 0 26.5 5t22.5 16l32 32q20 20 20 49v351q0 40-40 40h-10q-40 0-40-40v-322q0-40-40-40h-19q-40 0-40 40v322q0 40-40 40h-10q-40 0-40-40v-322q0-40-40-40h-23q-40 0-40 40v322q0 40-40 40"/></svg>
        </div>
    </div>
    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('wave-field');
            const ctx = canvas.getContext('2d');
            let w, h, cx, cy, dpr;
            let time = 0;
            let mouse = { x: 0, y: 0, active: false };

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;
                cx = w / 2;
                cy = h / 2;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            // Timeline wave parameters
            // Each wave has: amplitude, frequency, speed, phase, color, opacity
            // Past waves are solid, future waves fork into probability bands
            const waves = [
                // Primary signal waves - brand blue family
                { amp: 35, freq: 0.008, speed: 0.012, phase: 0,    color: [108, 140, 255], opacity: 0.4 },
                { amp: 25, freq: 0.012, speed: 0.015, phase: 1.2,  color: [108, 140, 255], opacity: 0.25 },
                { amp: 50, freq: 0.005, speed: 0.008, phase: 2.5,  color: [130, 108, 220], opacity: 0.2 },
                // Subtle harmonic echoes
                { amp: 15, freq: 0.02,  speed: 0.02,  phase: 0.8,  color: [160, 180, 255], opacity: 0.15 },
                { amp: 40, freq: 0.006, speed: 0.01,  phase: 3.8,  color: [90, 120, 200],  opacity: 0.12 },
            ];

            // Prediction fork parameters
            const forkCount = 3;
            const forkSpread = 0.6; // How much futures diverge

            // Smooth cursor influence - gaussian falloff, proportional to vertical offset
            function cursorDeflection(x, y) {
                if (!mouse.active) return 0;
                const dx = x - mouse.x;
                const dy = y - mouse.y;
                const distSq = dx * dx + dy * dy;
                const radius = 200;
                if (distSq > radius * radius) return 0;
                // Smooth gaussian-like falloff instead of linear
                const falloff = Math.exp(-distSq / (radius * radius * 0.18));
                // Push proportional to dy so it's smooth through center
                return dy * falloff * 0.35;
            }

            function waveY(x, wave, t) {
                const { amp, freq, speed, phase } = wave;
                const timeOffset = t * speed;
                const normalizedX = x - cx;
                return cy + Math.sin(normalizedX * freq + timeOffset + phase) * amp
                           + Math.sin(normalizedX * freq * 1.7 + timeOffset * 0.7 + phase) * amp * 0.3;
            }

            function drawWave(wave, t) {
                const { color, opacity } = wave;
                const nowX = cx;
                const step = 3;

                // === PAST (left of center) - solid, confident ===
                ctx.beginPath();
                let firstPoint = true;

                for (let x = 0; x <= nowX; x += step) {
                    let y = waveY(x, wave, t);
                    y += cursorDeflection(x, y);
                    if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; }
                    else ctx.lineTo(x, y);
                }

                ctx.strokeStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${opacity})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // === FUTURE (right of center) - forking probability bands ===
                for (let f = 0; f < forkCount; f++) {
                    const forkOffset = (f - (forkCount - 1) / 2) * forkSpread;
                    ctx.beginPath();
                    firstPoint = true;

                    for (let x = nowX; x <= w; x += step) {
                        const dist = x - nowX;
                        const divergence = forkOffset * (dist / (w - nowX));
                        const forkY = divergence * wave.amp * 1.5;
                        let y = waveY(x, wave, t) + forkY;
                        y += cursorDeflection(x, y);

                        if (firstPoint) { ctx.moveTo(x, y); firstPoint = false; }
                        else ctx.lineTo(x, y);
                    }

                    const forkOpacity = opacity * (f === Math.floor(forkCount / 2) ? 0.7 : 0.3);
                    ctx.strokeStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${forkOpacity})`;
                    ctx.lineWidth = f === Math.floor(forkCount / 2) ? 1.2 : 0.7;
                    ctx.stroke();
                }
            }

            // Horizontal data stream - tiny dots flowing along the timeline
            const streamDots = [];
            const maxDots = 60;

            function initDots() {
                for (let i = 0; i < maxDots; i++) {
                    streamDots.push({
                        x: Math.random() * w,
                        speed: 1.5 + Math.random() * 3,
                        waveIdx: Math.floor(Math.random() * waves.length),
                        size: 0.5 + Math.random() * 1.5,
                        brightness: 0.3 + Math.random() * 0.7
                    });
                }
            }

            function updateAndDrawDots(t) {
                for (let i = 0; i < streamDots.length; i++) {
                    const dot = streamDots[i];
                    dot.x -= dot.speed;
                    if (dot.x < -10) {
                        dot.x = w + 10;
                        dot.waveIdx = Math.floor(Math.random() * waves.length);
                    }

                    const wave = waves[dot.waveIdx];
                    let y = waveY(dot.x, wave, t);
                    y += cursorDeflection(dot.x, y);

                    const futureF = dot.x > cx ? Math.max(0.2, 1 - (dot.x - cx) / (w - cx)) : 1;
                    const alpha = dot.brightness * futureF * 0.6;

                    ctx.beginPath();
                    ctx.arc(dot.x, y, dot.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${wave.color[0]}, ${wave.color[1]}, ${wave.color[2]}, ${alpha})`;
                    ctx.fill();
                }
            }

            function animate() {
                time++;

                ctx.clearRect(0, 0, w, h);

                // Draw waves
                for (let i = 0; i < waves.length; i++) {
                    drawWave(waves[i], time);
                }

                // Streaming dots
                updateAndDrawDots(time);

                requestAnimationFrame(animate);
            }

            // Events
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resize();
                    streamDots.length = 0;
                    initDots();
                }, 150);
            });

            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            });
            document.addEventListener('mouseleave', () => { mouse.active = false; });
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                    mouse.active = true;
                }
            });
            document.addEventListener('touchend', () => { mouse.active = false; });

            // Init
            resize();
            initDots();
            animate();
        })();
    </script>
</body>
</html>
