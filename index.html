<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="nim">
    <meta name="theme-color" content="#0a0a0f">
    <title>nim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
        }

        /* Main container */
        #void {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a0f 50%, #000000 100%);
        }

        /* Neural network canvas */
        #neural-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Perspective grid canvas */
        #grid-abyss {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.13;
        }

        /* The sacred text container */
        #nim-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }

        /* SVG Logo */
        #nim-logo {
            width: clamp(160px, 40vw, 480px);
            height: auto;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.8))
                    drop-shadow(0 0 30px rgba(0, 255, 255, 0.4))
                    drop-shadow(0 0 60px rgba(0, 255, 255, 0.2));
            animation: nim-breathe 5.4s ease-in-out infinite;
        }

        @keyframes nim-breathe {
            0%, 100% {
                opacity: 0.68;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.01);
            }
        }

        /* Scanlines overlay */
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            opacity: 0.4;
        }

        /* CRT vignette */
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 60%, rgba(0, 0, 0, 0.8) 100%);
        }

        /* Pulse ring effect */
        #pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            animation: pulse-expand 4s ease-out infinite;
        }

        #pulse-ring::before,
        #pulse-ring::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        #pulse-ring::before {
            width: 100%;
            height: 100%;
            animation: pulse-expand 4s ease-out infinite 1s;
        }

        #pulse-ring::after {
            width: 100%;
            height: 100%;
            animation: pulse-expand 4s ease-out infinite 2s;
        }

        @keyframes pulse-expand {
            0% {
                width: 200px;
                height: 200px;
                opacity: 0.5;
            }
            100% {
                width: 800px;
                height: 800px;
                opacity: 0;
            }
        }

        /* Ambient light leak */
        #light-leak {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(0, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 255, 255, 0.02) 0%, transparent 70%);
            animation: light-shift 15s ease-in-out infinite;
        }

        @keyframes light-shift {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
        }
    </style>
</head>
<body>
    <div id="void">
        <canvas id="grid-abyss"></canvas>
        <canvas id="neural-field"></canvas>
        <div id="light-leak"></div>
        <div id="pulse-ring"></div>
        <div id="nim-container">
            <!-- nim logo - NASA worm style: smooth, rounded, flowing -->
            <svg id="nim-logo" viewBox="0 0 200 55" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="#00ffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
                    <!-- n: smooth arch -->
                    <path d="M 5 50 L 5 25 C 5 12, 18 12, 28 12 C 38 12, 45 12, 45 25 L 45 50"/>
                    <!-- i: stem + dot -->
                    <path d="M 65 50 L 65 20"/>
                    <circle cx="65" cy="6" r="5" fill="#00ffff" stroke="none"/>
                    <!-- m: double arch flowing continuously -->
                    <path d="M 85 50 L 85 25 C 85 12, 98 12, 108 12 C 118 12, 122 12, 122 25 L 122 50 M 122 25 C 122 12, 135 12, 145 12 C 155 12, 160 12, 160 25 L 160 50"/>
                </g>
            </svg>
        </div>
    </div>
    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // nim - neural intelligence matrix
        // ═══════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            const CONFIG = {
                particles: {
                    count: 150,
                    maxSize: 3,
                    minSize: 0.5,
                    connectionDistance: 150,
                    connectionOpacity: 0.15,
                    speed: 0.3,
                    pulseSpeed: 0.02
                },
                colors: {
                    primary: { r: 0, g: 255, b: 255 },
                    secondary: { r: 0, g: 200, b: 255 },
                    tertiary: { r: 100, g: 255, b: 255 },
                    accent: { r: 0, g: 255, b: 200 }
                },
                mouse: {
                    influenceRadius: 200,
                    repelStrength: 0.5,
                    awareness: true
                },
                grid: {
                    spacing: 50,
                    horizon: 0.35,
                    speed: 0.5
                },
                synapticBurst: {
                    interval: 3000,
                    duration: 500,
                    rippleSpeed: 300
                }
            };

            let neuralCanvas, neuralCtx;
            let gridCanvas, gridCtx;
            let particles = [];
            let mouse = { x: null, y: null, active: false };
            let time = 0;
            let gridOffset = 0;
            let lastBurst = 0;
            let burstOrigin = null;
            let burstTime = 0;

            class PerlinNoise {
                constructor() {
                    this.permutation = [];
                    for (let i = 0; i < 256; i++) {
                        this.permutation[i] = Math.floor(Math.random() * 256);
                    }
                    this.p = [...this.permutation, ...this.permutation];
                }

                fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
                lerp(a, b, t) { return a + t * (b - a); }

                grad(hash, x, y) {
                    const h = hash & 3;
                    const u = h < 2 ? x : y;
                    const v = h < 2 ? y : x;
                    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
                }

                noise(x, y) {
                    const X = Math.floor(x) & 255;
                    const Y = Math.floor(y) & 255;
                    x -= Math.floor(x);
                    y -= Math.floor(y);
                    const u = this.fade(x);
                    const v = this.fade(y);
                    const A = this.p[X] + Y;
                    const B = this.p[X + 1] + Y;
                    return this.lerp(
                        this.lerp(this.grad(this.p[A], x, y), this.grad(this.p[B], x - 1, y), u),
                        this.lerp(this.grad(this.p[A + 1], x, y - 1), this.grad(this.p[B + 1], x - 1, y - 1), u),
                        v
                    );
                }
            }

            const perlin = new PerlinNoise();

            class Particle {
                constructor(x, y) {
                    this.x = x || Math.random() * neuralCanvas.width;
                    this.y = y || Math.random() * neuralCanvas.height;
                    this.size = Math.random() * (CONFIG.particles.maxSize - CONFIG.particles.minSize) + CONFIG.particles.minSize;
                    this.baseSize = this.size;
                    this.vx = (Math.random() - 0.5) * CONFIG.particles.speed;
                    this.vy = (Math.random() - 0.5) * CONFIG.particles.speed;
                    this.phase = Math.random() * Math.PI * 2;
                    this.noiseOffsetX = Math.random() * 1000;
                    this.noiseOffsetY = Math.random() * 1000;
                    this.colorType = Math.floor(Math.random() * 4);
                    this.brightness = 0.5 + Math.random() * 0.5;
                    this.activated = false;
                    this.activationTime = 0;
                }

                getColor(alpha = 1) {
                    const colors = [CONFIG.colors.primary, CONFIG.colors.secondary, CONFIG.colors.tertiary, CONFIG.colors.accent];
                    const c = colors[this.colorType];
                    const b = this.brightness * (this.activated ? 2 : 1);
                    return `rgba(${Math.min(255, c.r * b)}, ${Math.min(255, c.g * b)}, ${Math.min(255, c.b * b)}, ${alpha})`;
                }

                update() {
                    const noiseX = perlin.noise(this.noiseOffsetX + time * 0.0005, this.noiseOffsetY);
                    const noiseY = perlin.noise(this.noiseOffsetX, this.noiseOffsetY + time * 0.0005);
                    this.vx += noiseX * 0.01;
                    this.vy += noiseY * 0.01;
                    this.vx *= 0.99;
                    this.vy *= 0.99;

                    if (mouse.active && CONFIG.mouse.awareness) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.mouse.influenceRadius) {
                            const force = (CONFIG.mouse.influenceRadius - dist) / CONFIG.mouse.influenceRadius;
                            const angle = Math.atan2(dy, dx);
                            const repel = dist < CONFIG.mouse.influenceRadius * 0.3;
                            const strength = repel ? -CONFIG.mouse.repelStrength : CONFIG.mouse.repelStrength * 0.2;
                            this.vx += Math.cos(angle) * force * strength;
                            this.vy += Math.sin(angle) * force * strength;
                            this.brightness = Math.min(1.5, this.brightness + force * 0.1);
                        }
                    }

                    this.x += this.vx;
                    this.y += this.vy;

                    const margin = 50;
                    if (this.x < -margin) this.x = neuralCanvas.width + margin;
                    if (this.x > neuralCanvas.width + margin) this.x = -margin;
                    if (this.y < -margin) this.y = neuralCanvas.height + margin;
                    if (this.y > neuralCanvas.height + margin) this.y = -margin;

                    this.phase += CONFIG.particles.pulseSpeed;
                    this.size = this.baseSize * (1 + Math.sin(this.phase) * 0.3);
                    this.brightness = Math.max(0.5, this.brightness * 0.995);

                    if (this.activated) {
                        this.activationTime++;
                        if (this.activationTime > 30) {
                            this.activated = false;
                            this.activationTime = 0;
                        }
                    }
                }

                draw() {
                    const glow = neuralCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                    glow.addColorStop(0, this.getColor(0.8));
                    glow.addColorStop(0.5, this.getColor(0.2));
                    glow.addColorStop(1, this.getColor(0));
                    neuralCtx.beginPath();
                    neuralCtx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                    neuralCtx.fillStyle = glow;
                    neuralCtx.fill();
                    neuralCtx.beginPath();
                    neuralCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    neuralCtx.fillStyle = this.getColor(1);
                    neuralCtx.fill();
                }

                activate() {
                    this.activated = true;
                    this.activationTime = 0;
                    this.brightness = 2;
                }
            }

            function init() {
                neuralCanvas = document.getElementById('neural-field');
                neuralCtx = neuralCanvas.getContext('2d');
                gridCanvas = document.getElementById('grid-abyss');
                gridCtx = gridCanvas.getContext('2d');
                resize();
                createParticles();
                setupEventListeners();
                animate();
            }

            function resize() {
                neuralCanvas.width = window.innerWidth;
                neuralCanvas.height = window.innerHeight;
                gridCanvas.width = window.innerWidth;
                gridCanvas.height = window.innerHeight;
            }

            function createParticles() {
                particles = [];
                for (let i = 0; i < CONFIG.particles.count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * Math.min(neuralCanvas.width, neuralCanvas.height) * 0.6;
                    const x = neuralCanvas.width / 2 + Math.cos(angle) * radius;
                    const y = neuralCanvas.height / 2 + Math.sin(angle) * radius;
                    particles.push(new Particle(x, y));
                }
            }

            function setupEventListeners() {
                window.addEventListener('resize', () => { resize(); createParticles(); });
                document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
                document.addEventListener('mouseleave', () => { mouse.active = false; });
                document.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true; }
                });
                document.addEventListener('touchend', () => { mouse.active = false; });
            }

            function triggerSynapticBurst() {
                const now = Date.now();
                if (now - lastBurst > CONFIG.synapticBurst.interval) {
                    lastBurst = now;
                    burstTime = 0;
                    if (Math.random() > 0.5) {
                        burstOrigin = { x: neuralCanvas.width / 2, y: neuralCanvas.height / 2 };
                    } else {
                        const p = particles[Math.floor(Math.random() * particles.length)];
                        burstOrigin = { x: p.x, y: p.y };
                    }
                }
            }

            function updateSynapticBurst() {
                if (!burstOrigin) return;
                burstTime += 16;
                const rippleRadius = burstTime * CONFIG.synapticBurst.rippleSpeed / 1000;
                particles.forEach(p => {
                    const dist = Math.sqrt((p.x - burstOrigin.x) ** 2 + (p.y - burstOrigin.y) ** 2);
                    if (Math.abs(dist - rippleRadius) < 30) p.activate();
                });
                if (burstTime > CONFIG.synapticBurst.duration) burstOrigin = null;
            }

            function drawGrid() {
                gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
                const horizon = gridCanvas.height * CONFIG.grid.horizon;
                const vanishX = gridCanvas.width / 2;
                const spacing = CONFIG.grid.spacing;

                // Horizontal lines
                for (let i = 0; i < 30; i++) {
                    const t = i / 30;
                    const y = horizon + (gridCanvas.height - horizon) * Math.pow(t, 1.5);
                    gridCtx.strokeStyle = `rgba(0, 255, 255, ${0.1 + t * 0.2})`;
                    gridCtx.lineWidth = 1;
                    gridCtx.beginPath();
                    gridCtx.moveTo(0, y);
                    gridCtx.lineTo(gridCanvas.width, y);
                    gridCtx.stroke();
                }

                // Vertical lines
                for (let i = -20; i <= 20; i++) {
                    const baseX = vanishX + i * spacing * 3;
                    const alpha = 0.15 - Math.abs(i) * 0.005;
                    if (alpha <= 0) continue;
                    gridCtx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                    gridCtx.beginPath();
                    gridCtx.moveTo(vanishX, horizon);
                    gridCtx.lineTo(baseX, gridCanvas.height);
                    gridCtx.stroke();
                }

                // Horizon glow
                const horizonGlow = gridCtx.createLinearGradient(0, horizon - 50, 0, horizon + 50);
                horizonGlow.addColorStop(0, 'rgba(0, 255, 255, 0)');
                horizonGlow.addColorStop(0.5, 'rgba(0, 255, 255, 0.08)');
                horizonGlow.addColorStop(1, 'rgba(0, 255, 255, 0)');
                gridCtx.fillStyle = horizonGlow;
                gridCtx.fillRect(0, horizon - 50, gridCanvas.width, 100);
            }

            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONFIG.particles.connectionDistance) {
                            const alpha = (1 - dist / CONFIG.particles.connectionDistance) * CONFIG.particles.connectionOpacity;
                            const gradient = neuralCtx.createLinearGradient(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
                            gradient.addColorStop(0, particles[i].getColor(alpha));
                            gradient.addColorStop(1, particles[j].getColor(alpha));
                            neuralCtx.beginPath();
                            neuralCtx.moveTo(particles[i].x, particles[i].y);
                            neuralCtx.lineTo(particles[j].x, particles[j].y);
                            neuralCtx.strokeStyle = gradient;
                            neuralCtx.lineWidth = 0.5 + alpha * 2;
                            neuralCtx.stroke();
                        }
                    }
                }
            }

            function animate() {
                time++;
                neuralCtx.fillStyle = 'rgba(10, 10, 15, 0.05)';
                neuralCtx.fillRect(0, 0, neuralCanvas.width, neuralCanvas.height);
                drawGrid();
                triggerSynapticBurst();
                updateSynapticBurst();
                drawConnections();
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
